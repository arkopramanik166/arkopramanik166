name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(profile): refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
